    background-size: cover;
    background-position: center 38%;
    display: flex;
    align-items: flex-end;
  }
  #vibe-app .hero-inner {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px 30px;
  }
  #vibe-app .eyebrow {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin: 0 0 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  #vibe-app h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(28px, 4.2vw, 46px);
    line-height: 1.12;
    margin: 0 0 14px;
    color: var(--paper);
    max-width: 15ch;
    text-shadow: 0 4px 22px rgba(0,0,0,0.55);
  }
  #vibe-app .sub {
    font-size: 14.5px;
    line-height: 1.6;
    color: #D9DCE8;
    max-width: 46ch;
    margin: 0;
    text-shadow: 0 2px 14px rgba(0,0,0,0.6);
  }
  #vibe-app .ticket-block { padding-top: 26px; }

  /* ---------- Ticket-window input ---------- */
  #vibe-app .ticket {
    position: relative;
    background: var(--paper);
    color: var(--paper-text);
    border-radius: 14px;
    padding: 22px 22px 16px;
    margin-top: -54px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.75);
  }
  #vibe-app .ticket::before,
  #vibe-app .ticket::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    background: var(--ink);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
  }
  #vibe-app .ticket::before { left: -13px; }
  #vibe-app .ticket::after { right: -13px; }
  #vibe-app .ticket-label {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 10px;
  }
  #vibe-app .ticket-row { display: flex; gap: 12px; align-items: flex-end; }
  #vibe-app textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink-text);
    min-height: 54px;
    padding: 4px 0;
  }
  #vibe-app textarea::placeholder { color: #9C9483; opacity: 1; }
  #vibe-app .go-btn {
    flex-shrink: 0;
    border: none;
    background: var(--ink);
    color: var(--gold-soft);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 13px 18px;

</style>

<script>
(function(){
  const root = document.getElementById('vibe-app');

  // ---------------- Dataset ----------------
  const STAYS = [
    { id:'lakehut', name:'Tarn House', loc:'Kielder Water, England', price:118, rating:4.9, host:'Superhost · 62 stays',
      blurb:'A timber one-room cabin on stilts over still water, gas lamps lit each evening.',
      tags:['water','quiet','secluded','warm-light','cabin','wifi-fast'], grad:'linear-gradient(160deg,#2E4A63,#1B2E42 60%,#3E5B47)',
      notes:{ water:'Deck sits directly over the tarn — water on three sides.', quiet:'Nearest neighbor is 900m away, no road noise logged in reviews.', 'warm-light':'Guests specifically mention the amber lamp glow at dusk.', 'wifi-fast':'Starlink installed 2025, verified 90+ Mbps.' } },
    { id:'fjordbox', name:'Skarvet Studio', loc:'Lofoten, Norway', price:164, rating:4.8, host:'Verified host',
      blurb:'Glass-fronted studio facing a fjord, wood stove, minimal everything.',
      tags:['water','quiet','secluded','cabin','cold','warm-light'], grad:'linear-gradient(160deg,#22344A,#0F1B2B 55%,#4C6E7A)',
      notes:{ water:'Fjord fills the entire west-facing window wall.', secluded:'Single-cabin plot, no shared land.', 'warm-light':'Stove + low lamps only — hosts note no overhead lighting at all.' } },
    { id:'riverloft', name:'Millrace Loft', loc:'Cotswolds, England', price:96, rating:4.7, host:'Superhost · 140 stays',
      blurb:'Converted mill loft above a running river, exposed beams, fast fibre.',
      tags:['water','wifi-fast','cabin','warm-light','city-close'], grad:'linear-gradient(160deg,#3B4A3B,#25301F 60%,#5C6B45)',
      notes:{ water:'Built directly on the old millrace — river runs underfoot.', 'wifi-fast':'1Gbps fibre, popular with remote workers per reviews.', 'city-close':'18 minutes to Cirencester.' } },
    { id:'desertdome', name:'Salt Dome', loc:'Atacama, Chile', price:210, rating:4.95, host:'Superhost · 31 stays',
      blurb:'A geodesic dome on a dry salt flat, glass ceiling for the stars.',
      tags:['secluded','quiet','warm-light','cheap-not'], grad:'linear-gradient(160deg,#4A3B2E,#241C14 60%,#7A5C3E)',
      notes:{ secluded:'Nearest town is a 40-minute drive.', quiet:'No wind noise reported past 8pm.', 'warm-light':'Interior lit entirely by string lights and a single brass lamp.' } },
    { id:'overwater1', name:'Vaiara Water Villa', loc:'Bora Bora, French Polynesia', price:640, rating:4.9, host:'Superhost · 89 stays',
      blurb:'Classic overwater bungalow with a glass floor panel and private ladder into the lagoon.',
      tags:['overwater','water','warm-light','foodie-far'], grad:'linear-gradient(160deg,#1E5A6B,#0D2E38 55%,#3E8E9E)',
      notes:{ overwater:'Built on stilts directly over the lagoon.', water:'Private ladder for swimming from the deck.' } },
    { id:'canalflat', name:'Herengracht Nook', loc:'Amsterdam, Netherlands', price:151, rating:4.6, host:'Verified host',
      blurb:'Narrow canal-house flat, three Michelin restaurants within a 10-minute walk.',
      tags:['water','city-close','foodie','wifi-fast'], grad:'linear-gradient(160deg,#2A3A4A,#161F29 60%,#4A5A3A)',
      notes:{ water:'Canal-front, houseboats visible from the kitchen window.', foodie:'Three Michelin-starred kitchens within 900m, listed by name in the guidebook.', 'city-close':'Central Amsterdam, 6-minute tram to the museum quarter.' } },
    { id:'budgetcabin', name:'Wren Shed', loc:'Snowdonia, Wales', price:52, rating:4.5, host:'New host · 9 stays',
      blurb:'A no-frills timber shed with a wood burner, 4 minutes from a lake.',
      tags:['cheap','water','quiet','cabin','secluded'], grad:'linear-gradient(160deg,#324A34,#182619 60%,#4F6A3E)',
      notes:{ cheap:'Lowest nightly rate within 20km of water in this region.', water:'4-minute walk to Llyn Padarn.', quiet:'No wifi, no road — reviewers call it "properly silent".' } },
    { id:'citypod', name:'Ropewalk Studio', loc:'Bristol, England', price:74, rating:4.4, host:'Superhost · 210 stays',
      blurb:'Small harbourside studio, walkable to everything, gigabit wifi for calls.',
      tags:['city-close','wifi-fast','cheap','water'], grad:'linear-gradient(160deg,#3A2E4A,#1E1729 60%,#5A4A6E)',
      notes:{ 'city-close':'7-minute walk to the city centre.', 'wifi-fast':'Gigabit line, dedicated desk noted by remote-work guests.', water:'Overlooks the floating harbour.' } },
    { id:'cliffcave', name:'Punta Cave House', loc:'Matera, Italy', price:132, rating:4.85, host:'Superhost · 54 stays',
      blurb:'A carved stone cave dwelling, warm lamp-lit interior, restaurants two minutes away.',
      tags:['warm-light','quiet','foodie','secluded'], grad:'linear-gradient(160deg,#4A3B2A,#241B10 60%,#7A5A34)',
      notes:{ 'warm-light':'Stone walls hold and reflect lamp light — reviewers call it "glowing".', foodie:'Two well-reviewed trattorias within 2 minutes on foot.', quiet:'Cave construction blocks nearly all outside sound.' } },
    { id:'houseboat', name:'Reed Barge', loc:'Kerala Backwaters, India', price:88, rating:4.7, host:'Verified host',
      blurb:'A quiet houseboat moored off the main channel, evening lamps, slow water.',
      tags:['water','quiet','warm-light','secluded','cheap'], grad:'linear-gradient(160deg,#2E4A3E,#162A20 60%,#4C6E4E)',
      notes:{ water:'Moored on the backwaters, water on all sides.', quiet:'Off the main tourist channel — reviewers note "no passing boat noise".', 'warm-light':'Kerosene lamps used each evening by the crew.' } }
  ];

  // simple keyword -> tag map for parsing free text
  const KEYWORDS = {
    quiet:['quiet','silent','silence','peaceful','still'],
    water:['water','lake','river','fjord','canal','sea','ocean','backwater'],
    secluded:['secluded','remote','isolated','private','alone'],
    'warm-light':['warm light','warm-light','evening light','lamp','glow','cosy','cozy','ambient'],
    cabin:['cabin','cottage','hut','shed'],
    'wifi-fast':['wifi','wi-fi','fast internet','fibre','fiber','remote work','broadband'],
    cheap:['cheap','budget','affordable','inexpensive','under $','low cost'],
    'city-close':['city','walkable','central','downtown','close to town'],
    foodie:['michelin','restaurant','fine dining','food scene','chef'],
    overwater:['overwater','over water','floating','bungalow']
  };

  function parseTags(text){
    const t = text.toLowerCase();
    const found = new Set();
    Object.entries(KEYWORDS).forEach(([tag, words])=>{
      if (words.some(w=>t.includes(w))) found.add(tag);
    });
    return found;
  }

  function scoreStay(stay, tagWeights){
    let score = 0;
    tagWeights.forEach((weight, tag)=>{
      if (stay.tags.includes(tag)) score += weight;
    });
    return score;
  }

  // ---------------- State ----------------
  let tagWeights = new Map();      // tag -> weight
  let trailLabels = [];            // {id, label, tag}
  let lastResults = [];
  let openNoteId = null;
  let fallbackMode = false;
  let fallbackPrompt = '';

  function addTag(tag, label, weight){
    tagWeights.set(tag, (tagWeights.get(tag)||0) + weight);
    if (!trailLabels.find(t=>t.tag===tag)) trailLabels.push({ id: 'trail-'+tag+'-'+Date.now(), tag, label });
  }
  function removeTrail(id){
    const item = trailLabels.find(t=>t.id===id);
    if (item) tagWeights.delete(item.tag);
    trailLabels = trailLabels.filter(t=>t.id!==id);
    render();
  }

  function runSearch(promptText){
    fallbackMode = false;
    const parsed = parseTags(promptText);
    tagWeights = new Map();
    trailLabels = [];
    parsed.forEach(tag => addTag(tag, prettyTag(tag), 3));

    evaluate(promptText);
  }

  function evaluate(promptForFallback){
    const scored = STAYS.map(s => ({ stay: s, score: scoreStay(s, tagWeights) }))
                        .sort((a,b)=>b.score - a.score);
    const top = scored[0]?.score || 0;
    const askedTags = [...tagWeights.keys()];

    // Fallback trigger: user asked for overwater + foodie + cheap together (rare/contradictory combo)
    const askingOverwaterFoodieCheap = askedTags.includes('overwater') && askedTags.includes('foodie') && askedTags.includes('cheap');

    if (top === 0 || askingOverwaterFoodieCheap){
      fallbackMode = true;
      fallbackPrompt = promptForFallback || '';
      lastResults = scored.slice(0,2).map(s=>s.stay);
      render();
      return;
    }
    lastResults = scored.filter(s=>s.score>0).slice(0,6).map(s=>s.stay);
    if (lastResults.length === 0) lastResults = scored.slice(0,4).map(s=>s.stay);
    render();
  }

  function prettyTag(tag){
    const map = {
      quiet:'quiet', water:'near water', secluded:'secluded', 'warm-light':'warm evening light',
      cabin:'cabin-style', 'wifi-fast':'fast wifi', cheap:'lower price', 'city-close':'close to a city',
      foodie:'near great food', overwater:'overwater'
    };
    return map[tag] || tag;
  }

  function matchPercent(stay){
    const total = [...tagWeights.values()].reduce((a,b)=>a+b,0) || 1;
    const got = [...tagWeights.entries()].reduce((sum,[tag,w])=> stay.tags.includes(tag) ? sum+w : sum, 0);
    return Math.max(38, Math.min(99, Math.round((got/total)*100)));
  }

  function matchedTagsFor(stay){
    return [...tagWeights.keys()].filter(t=>stay.tags.includes(t) && stay.notes[t]);
  }

  // ---------------- Render ----------------
  function render(){
    const hasResults = lastResults.length > 0;
    root.innerHTML = `
      <div class="hero-photo">
        <div class="hero-inner">
          <p class="eyebrow">Field Notes / Departure 01</p>
          <h1>Describe the trip, not the filters.</h1>
          <p class="sub">Skip the fifteen dropdowns. Say what the place should feel like — we'll build the board.</p>
        </div>
      </div>
      <div class="wrap">
        <div class="ticket-block">
        <div class="ticket">
          <p class="ticket-label">✦ Boarding — one sentence is enough</p>
          <div class="ticket-row">
            <textarea id="promptInput" rows="2" placeholder="e.g. a quiet cabin near water with fast wifi and warm light in the evenings…"></textarea>
            <button class="go-btn" id="goBtn">Find the vibe →</button>
          </div>
          <div class="ticket-perf">
            <span class="try-label">Try:</span>
            <button class="try-chip" data-try="a quiet cabin near water with fast wifi and warm light in the evenings">quiet cabin, water, warm light</button>
            <button class="try-chip" data-try="somewhere secluded and cheap by a lake, no rush">secluded + cheap by a lake</button>
            <button class="try-chip" data-try="an overwater bungalow near a Michelin restaurant for $30 a night">overwater + Michelin, $30/night</button>
          </div>
        </div>
        </div>

        <div class="trail">
          ${trailLabels.map(t=>`
            <span class="trail-chip">${t.label}<button data-remove="${t.id}" aria-label="Remove">×</button></span>
          `).join('')}
        </div>

        ${!hasResults ? '' : fallbackMode ? renderFallback() : renderBoard()}

        <p class="footer-note">Prototype board — matches are generated from a small demo set of ten stays to illustrate the interaction, not live inventory.</p>
      </div>
    `;
    wireEvents();
  }

  function renderBoard(){
    return `
      <div class="board-head">
        <span class="board-title">Your board</span>
        <span class="board-count">${lastResults.length} matches, ranked by fit</span>
      </div>
      <div class="grid">
        ${lastResults.map(stay => cardHTML(stay)).join('')}
      </div>
      <div class="correct-bar">
        <span class="correct-label">Not quite —</span>
        <button class="chip" data-refine="cheap">Make it cheaper</button>
        <button class="chip" data-refine="secluded">More secluded</button>
        <button class="chip" data-refine="warm-light">Warmer light</button>
        <button class="chip" data-refine="city-close">Closer to a city</button>
        <button class="chip gold" data-refine="surprise">Surprise me</button>
      </div>
    `;
  }

  function cardHTML(stay){
    const pct = matchPercent(stay);
    const isOpen = openNoteId === stay.id;
    const matched = matchedTagsFor(stay);
    return `
      <div class="card" data-card="${stay.id}">
        <div class="scene" style="background:${stay.grad}">
          <div class="stamp">${pct}%<small>MATCH</small></div>
        </div>
        <div class="card-body">
          <p class="card-loc">${stay.loc}</p>
          <p class="card-name">${stay.name}</p>
          <p class="card-blurb">${stay.blurb}</p>
          <div class="card-meta">
            <span class="price">$${stay.price}/night</span>
            <span class="host-badge">${stay.host} · ★${stay.rating}</span>
          </div>
          <div style="margin-top:8px;">
            <button class="why-btn" data-why="${stay.id}">${isOpen ? 'Hide reasoning' : 'Why this match?'}</button>
          </div>
        </div>
        ${isOpen ? `
          <div class="note">
            <p class="note-title">Matched on your prompt</p>
            <ul>
              ${matched.length ? matched.map(t=>`<li><span class="tag">${prettyTag(t)}</span> — ${stay.notes[t]}</li>`).join('')
                : `<li>Closest overall fit among the current board, though no single strong keyword match.</li>`}
            </ul>
          </div>` : ''}
      </div>
    `;
  }

  function renderFallback(){
    const asked = [...tagWeights.keys()].map(prettyTag);
    return `
      <div class="board-head">
        <span class="board-title">Your board</span>
        <span class="board-count">no perfect match</span>
      </div>
      <div class="fallback">
        <div class="fallback-head">
          <div class="fallback-mark">!</div>
          <div>
            <h3>Nothing hits all of that at once.</h3>
            <p>Nothing in range matches ${asked.length ? asked.map(a=>`"${a}"`).join(' + ') : 'that combination'} together — that exact mix is rare or doesn't exist near your price. Here's the closest we could find, and what we'd need to loosen to close the gap.</p>
          </div>
        </div>
        <div class="relax-row">
          <button class="relax-chip" data-relax="budget">Raise budget instead</button>
          <button class="relax-chip" data-relax="food">Swap Michelin for "great food nearby"</button>
          <button class="relax-chip" data-relax="type">Try overwater-style, not literal</button>
        </div>
        <div class="closest-grid">
          ${lastResults.map(stay=>`
            <div class="closest-card">
              <p class="card-loc">${stay.loc}</p>
              <p class="card-name" style="font-size:15px;">${stay.name}</p>
              <p class="card-blurb" style="margin-bottom:0;">${stay.blurb}</p>
              <div class="card-meta" style="border:none;padding-top:8px;">
                <span class="price">$${stay.price}/night</span>
                <span class="host-badge">★${stay.rating}</span>
              </div>
              <div class="gap-note">${gapNote(stay)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function gapNote(stay){
    const asked = [...tagWeights.keys()];
    const missing = asked.filter(t=>!stay.tags.includes(t));
    if (!missing.length) return 'Closest overall match on this board.';
    return `Closest fit — doesn't cover: ${missing.map(prettyTag).join(', ')}.`;
  }

  function wireEvents(){
    const input = root.querySelector('#promptInput');
    root.querySelector('#goBtn').addEventListener('click', ()=>{
      if (input.value.trim()) runSearch(input.value.trim());
    });
    input.addEventListener('keydown', e=>{
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        if (input.value.trim()) runSearch(input.value.trim());
      }
    });
    root.querySelectorAll('[data-try]').forEach(btn=>{
      btn.addEventListener('click', ()=> runSearch(btn.getAttribute('data-try')));
    });
    root.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=> removeTrail(btn.getAttribute('data-remove')));
    });
    root.querySelectorAll('[data-why]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-why');
        openNoteId = openNoteId === id ? null : id;
        render();
      });
    });
    root.querySelectorAll('[data-refine]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-refine');
        openNoteId = null;
        if (kind === 'surprise'){
          tagWeights.forEach((w,t)=> tagWeights.set(t, w*0.6));
          const randomStay = STAYS[Math.floor(Math.random()*STAYS.length)];
          randomStay.tags.forEach(t=> addTag(t, prettyTag(t)+' (surprise)', 1.5));
        } else {
          addTag(kind, prettyTag(kind), 4);
        }
        evaluate();
      });
    });
    root.querySelectorAll('[data-relax]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const kind = btn.getAttribute('data-relax');
        if (kind === 'budget') { tagWeights.delete('cheap'); }
        if (kind === 'food') { /* keep foodie but drop strict michelin weight */ tagWeights.set('foodie', 1); }
        if (kind === 'type') { tagWeights.set('overwater', 1); addTag('water','near water',2); }
        evaluate(fallbackPrompt);
      });
    });
  }

  render();
})();
</script>
